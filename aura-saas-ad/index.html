<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#050816"},
    {"id":"color-ink","type":"color","label":"Text","default":"#F4F6FF"},
    {"id":"color-accent","type":"color","label":"Accent (blue)","default":"#4F7BFF"},
    {"id":"color-accent-2","type":"color","label":"Accent (violet)","default":"#9B5CFF"},
    {"id":"color-glow","type":"color","label":"Glow (cyan)","default":"#38D6FF"},
    {"id":"font-display","type":"string","label":"Display font","default":"Outfit"},
    {"id":"font-ui","type":"string","label":"UI font","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #050816;
        --color-ink: #f4f6ff;
        --color-muted: #9aa3c7;
        --color-accent: #4f7bff;
        --color-accent-2: #9b5cff;
        --color-glow: #38d6ff;
        --color-red: #ff4d6d;
        --color-amber: #ffb547;
        --color-green: #2fd98b;
        --font-display: "Outfit";
        --font-ui: "Inter";
        --grad: linear-gradient(120deg, var(--color-accent) 0%, var(--color-accent-2) 100%);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-ui), sans-serif;
        color: var(--color-ink);
      }

      /* ---------- persistent stage: aurora glows + perspective grid ---------- */
      #bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 110%, #0c1236 0%, var(--color-ground) 62%);
      }
      .bg-glow {
        position: absolute;
        border-radius: 50%;
        opacity: 0.55;
      }
      #bg-glow-a {
        width: 1300px;
        height: 1300px;
        left: -380px;
        top: -520px;
        background: radial-gradient(circle, rgba(79, 123, 255, 0.55) 0%, rgba(79, 123, 255, 0) 65%);
      }
      #bg-glow-b {
        width: 1200px;
        height: 1200px;
        right: -420px;
        bottom: -560px;
        background: radial-gradient(circle, rgba(155, 92, 255, 0.5) 0%, rgba(155, 92, 255, 0) 65%);
      }
      #bg-glow-c {
        width: 800px;
        height: 800px;
        left: 760px;
        top: 260px;
        background: radial-gradient(circle, rgba(56, 214, 255, 0.22) 0%, rgba(56, 214, 255, 0) 65%);
      }
      #bg-grid {
        position: absolute;
        left: -480px;
        right: -480px;
        bottom: -260px;
        height: 760px;
        background-image:
          linear-gradient(rgba(120, 150, 255, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(120, 150, 255, 0.16) 1.5px, transparent 1.5px);
        background-size: 96px 96px;
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%);
        mask-image: linear-gradient(to top, #000 0%, transparent 85%);
      }

      /* ---------- shared glass system (used by every scene) ---------- */
      .glass {
        background: linear-gradient(140deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 55%, rgba(255, 255, 255, 0.08) 100%);
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.35),
          inset 0 -1px 0 rgba(255, 255, 255, 0.06),
          0 40px 90px rgba(2, 4, 20, 0.55);
        backdrop-filter: blur(26px) saturate(150%);
        -webkit-backdrop-filter: blur(26px) saturate(150%);
        border-radius: 28px;
      }
      .glass-dark {
        background: linear-gradient(160deg, rgba(22, 28, 62, 0.82) 0%, rgba(10, 14, 36, 0.86) 100%);
        border: 1.5px solid rgba(160, 180, 255, 0.2);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.16),
          0 50px 120px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(79, 123, 255, 0.06);
        backdrop-filter: blur(30px) saturate(160%);
        -webkit-backdrop-filter: blur(30px) saturate(160%);
        border-radius: 30px;
      }
      .sheen {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.22) 45%, rgba(255, 255, 255, 0) 60%);
        background-size: 300% 100%;
        background-position: 120% 0;
        pointer-events: none;
      }
      .grad-text {
        background: linear-gradient(100deg, #8fb0ff 0%, #c6a2ff 60%, #7fe7ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .display {
        font-family: var(--font-display), sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 0.98;
      }
      .word {
        display: inline-block;
      }

      /* callout chip, the storyboard's on-screen labels */
      .chip {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 18px 30px;
        border-radius: 18px;
        font-family: var(--font-display), sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        background: linear-gradient(120deg, rgba(79, 123, 255, 0.95), rgba(155, 92, 255, 0.95));
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        box-shadow:
          0 20px 50px rgba(79, 123, 255, 0.45),
          inset 0 1.5px 0 rgba(255, 255, 255, 0.5);
        white-space: nowrap;
      }
      .chip .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 14px #fff;
      }

      /* cursor: big, ~5% of frame */
      .cursor {
        position: absolute;
        width: 62px;
        height: 62px;
        z-index: 50;
        filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.5));
      }

      /* app chrome */
      .app {
        position: absolute;
        overflow: hidden;
      }
      .app-side {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 250px;
        padding: 34px 22px;
        border-right: 1.5px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.025);
      }
      .app-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--font-display), sans-serif;
        font-weight: 700;
        font-size: 32px;
        margin-bottom: 38px;
        padding-left: 8px;
      }
      .app-logo svg {
        width: 36px;
        height: 36px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 14px;
        font-size: 22px;
        color: var(--color-muted);
        margin-bottom: 6px;
      }
      .nav i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 2px solid currentColor;
        opacity: 0.8;
      }
      .nav.on {
        color: #fff;
        background: linear-gradient(120deg, rgba(79, 123, 255, 0.35), rgba(155, 92, 255, 0.25));
        border: 1px solid rgba(140, 160, 255, 0.35);
      }
      .app-main {
        position: absolute;
        left: 250px;
        right: 0;
        top: 0;
        bottom: 0;
        padding: 40px 46px;
      }
      .muted {
        color: var(--color-muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 28px;
        font-weight: 600;
      }
      .pill.red {
        color: #ff8aa0;
        background: rgba(255, 77, 109, 0.16);
        border: 1.5px solid rgba(255, 77, 109, 0.6);
      }
      .pill.blue {
        color: #9fb8ff;
        background: rgba(79, 123, 255, 0.16);
        border: 1.5px solid rgba(79, 123, 255, 0.45);
      }
      .pill.amber {
        color: #ffd08a;
        background: rgba(255, 181, 71, 0.14);
        border: 1.5px solid rgba(255, 181, 71, 0.45);
      }
      .pill.green {
        color: #7ff0bb;
        background: rgba(47, 217, 139, 0.14);
        border: 1.5px solid rgba(47, 217, 139, 0.45);
      }

      /* the glass folder: back panel with tab + papers + tilted front glass */
      .folder {
        position: absolute;
        width: 300px;
        height: 230px;
        transform-style: preserve-3d;
      }
      .folder .f-back {
        position: absolute;
        inset: 0;
        border-radius: 8px 22px 22px 22px;
        background: linear-gradient(170deg, rgba(120, 150, 255, 0.55), rgba(70, 60, 200, 0.35));
        border: 1.5px solid rgba(190, 205, 255, 0.45);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
      }
      .folder .f-tab {
        position: absolute;
        left: -1.5px;
        top: -34px;
        width: 128px;
        height: 40px;
        border-radius: 14px 18px 0 0;
        background: linear-gradient(170deg, rgba(150, 175, 255, 0.7), rgba(110, 120, 240, 0.5));
        border: 1.5px solid rgba(190, 205, 255, 0.5);
        border-bottom: none;
      }
      .folder .f-paper {
        position: absolute;
        left: 26px;
        right: 26px;
        height: 170px;
        top: 16px;
        border-radius: 12px;
        background: linear-gradient(180deg, #ffffff 0%, #dfe6ff 100%);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      }
      .folder .f-paper::before {
        content: "";
        position: absolute;
        left: 22px;
        right: 60px;
        top: 24px;
        height: 10px;
        border-radius: 6px;
        background: #b7c3ee;
        box-shadow:
          0 24px 0 #cdd6f6,
          0 48px 0 #cdd6f6,
          -0px 72px 0 #cdd6f6;
      }
      .folder .f-front {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 170px;
        border-radius: 18px 18px 22px 22px;
        transform-origin: 50% 100%;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.34) 0%, rgba(160, 180, 255, 0.16) 45%, rgba(120, 90, 255, 0.24) 100%);
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.7),
          inset 0 -20px 40px rgba(120, 90, 255, 0.25),
          0 -6px 30px rgba(79, 123, 255, 0.25);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        overflow: hidden;
      }
      .folder .f-label {
        position: absolute;
        left: 24px;
        bottom: 22px;
        font-family: var(--font-display), sans-serif;
        font-weight: 700;
        font-size: 30px;
        color: #fff;
        text-shadow: 0 2px 10px rgba(20, 20, 80, 0.5);
      }
      .folder .f-count {
        position: absolute;
        right: 22px;
        bottom: 24px;
        font-family: var(--font-display), sans-serif;
        font-weight: 600;
        font-size: 30px;
        color: rgba(255, 255, 255, 0.9);
      }
      .folder .f-icon {
        position: absolute;
        left: 24px;
        top: 22px;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.22);
        border: 1.5px solid rgba(255, 255, 255, 0.5);
        display: grid;
        place-items: center;
      }
      .folder .f-icon svg {
        width: 26px;
        height: 26px;
      }
    </style>
  </head>
  <body>

      <!-- voiceover (Kokoro af_heart, script from the storyboard) -->

    <script>
      const tl = gsap.timeline({ paused: true });
      // slow orbit of the light stage behind every scene
      tl.fromTo("#bg-glow-a", { x: 0, y: 0 }, { x: 520, y: 260, duration: 90, ease: "sine.inOut" }, 0);
      tl.fromTo("#bg-glow-b", { x: 0, y: 0 }, { x: -600, y: -200, duration: 90, ease: "sine.inOut" }, 0);
      tl.fromTo("#bg-glow-c", { x: -300, scale: 0.8 }, { x: 300, scale: 1.25, duration: 90, ease: "sine.inOut" }, 0);
      tl.fromTo("#bg-grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 1728px", duration: 90, ease: "none" }, 0);
      // the stage brightens when the product appears and on the end card
      tl.fromTo("#bg", { opacity: 0.55 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 5);
      window.__timelines["main"] = tl;
    </script>
